<!DOCTYPE html>
<html>
<head>
  <title>WCU Secure Portal</title>
  <!-- Mobile viewport for proper scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* General body setup */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    /* Login card */
    .card {
      background: white;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      color: #4F2586;
      margin-bottom: 10px;
    }

    p {
      color: #333;
      margin: 10px 0;
    }

    input {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 95%;
      padding: 12px;
      margin-top: 20px;
      background-color: #4F2586;
      color: #FFC627;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Terminal hack simulation */
    #terminal {
      display: none;
      background: black;
      color: #00ff00;
      font-family: monospace;
      padding: 30px;
      width: 100%;
      max-width: 700px;
      height: 100vh;
      overflow-y: auto;
      box-sizing: border-box;
      text-align: left;
    }

    .red {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- Friendly WCU login card -->
<div id="form">
  <div class="card">
    <img src="https://www.wcupa.edu/_services/images/logo.png" alt="WCU Logo" style="width:150px; margin-bottom:20px;">
    <h2>WCU Secure Login</h2>
    <p>Enter your name to access your account</p>
    <input type="text" id="nameInput" placeholder="First Name">
    <br>
    <button onclick="startHack()">Login</button>
  </div>
</div>

<!-- Hidden terminal for scary simulation -->
<div id="terminal"></div>

<script>
/* Detect device type */
function getDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return "iPhone";
  if (/Android/i.test(ua)) return "Android device";
  if (/iPad/i.test(ua)) return "iPad";
  return "Unknown device";
}

/* Fetch public IP safely */
async function getIP() {
  try {
    let res = await fetch("https://api.ipify.org?format=json");
    let data = await res.json();
    return data.ip;
  } catch {
    return "192.168.1.1"; // fallback if fetch fails
  }
}

/* Type line animation */
function typeLine(text, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      let p = document.createElement("p");
      p.innerHTML = text;
      document.getElementById("terminal").appendChild(p);
      window.scrollTo(0, document.body.scrollHeight);
      resolve();
    }, delay);
  });
}

/* Main hack simulation */
async function startHack() {
  let name = document.getElementById("nameInput").value.trim();
  if (!name) {
    alert("Please enter your name");
    return;
  }

  // Hide friendly login, show terminal
  document.getElementById("form").style.display = "none";
  document.getElementById("terminal").style.display = "block";

  let device = getDevice();
  let ip = await getIP();

  // Friendly connection first
  await typeLine("Connecting to WCU servers...", 800);
  await typeLine("Authenticating user...", 1200);

  // Scary simulation begins
  await typeLine("<span class='red'>WARNING: Suspicious activity detected</span>", 1500);
  await typeLine("Bypassing security protocols...", 1200);
  await typeLine("<span class='red'>ACCESS GRANTED</span>", 1200);

  await typeLine("Collecting device data...", 1200);
  await typeLine("Device: <span class='red'>" + device + "</span>", 1500);

  await typeLine("Locating user...", 1200);
  await typeLine("IP Address: <span class='red'>" + ip + "</span>", 1500);

  await typeLine("Extracting profile...", 1200);
  await typeLine("User identified: <span class='red'>" + name + "</span>", 1500);

  await typeLine("<span class='red'>DATA BREACH IN PROGRESS</span>", 1500);

  // Countdown for suspense
  for (let i = 5; i > 0; i--) {
    await typeLine("Uploading data in " + i + "...", 1000);
  }

  await typeLine("<span class='red'>TRANSFER COMPLETE</span>", 1200);

  // Educational reveal
  await typeLine("<br><span class='red'>⚠ THIS WAS A SIMULATION ⚠</span>", 2000);
  await typeLine("You scanned an unknown QR code.", 1500);
  await typeLine("You entered personal information.", 1500);
  await typeLine("Your device shared data automatically.", 1500);
  await typeLine("<br>This is how real phishing attacks begin.", 1800);
}
</script>

</body>
</html>
