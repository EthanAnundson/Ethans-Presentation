<!DOCTYPE html>
<html>
<head>
  <title>WCU Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* Top header bar */
    .header {
      background-color: #4F2586;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    /* Center login box */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 60px);
    }

    .login-box {
      background: white;
      padding: 30px;
      width: 90%;
      max-width: 380px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-align: center;
    }

    .logo {
      width: 140px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 10px 0;
      color: #333;
      font-weight: normal;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4F2586;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3a1b63;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
    }

    /* Terminal */
    #terminal {
      display: none;
      background: black;
      color: #00ff00;
      font-family: monospace;
      padding: 20px;
      height: 100vh;
      overflow-y: auto;
    }

    #terminal p {
      margin: 6px 0;
      color: #00ff00;
    }

    .red {
      color: #ff3b3b;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="form">
  <div class="header">West Chester University</div>

  <div class="container">
    <div class="login-box">
      
      <!-- Use local logo file -->
      <img src="logo.png" class="logo">

      <h2>Account Login</h2>
      <div class="subtitle">Use your WCU credentials</div>

      <input type="text" id="nameInput" placeholder="Username">
      <input type="password" placeholder="Password">

      <button onclick="startHack()">Login</button>

      <div class="footer">
        Forgot password? | IT Help Desk
      </div>

    </div>
  </div>
</div>

<div id="terminal"></div>

<script>
function getDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return "iPhone";
  if (/Android/i.test(ua)) return "Android device";
  return "Unknown device";
}

async function getIP() {
  try {
    let res = await fetch("https://api.ipify.org?format=json");
    let data = await res.json();
    return data.ip;
  } catch {
    return "192.168.1.1";
  }
}

function typeLine(text, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      let p = document.createElement("p");
      p.innerHTML = text;
      document.getElementById("terminal").appendChild(p);
      window.scrollTo(0, document.body.scrollHeight);
      resolve();
    }, delay);
  });
}

async function startHack() {
  let name = document.getElementById("nameInput").value.trim();
  if (!name) {
    alert("Enter a username");
    return;
  }

  document.getElementById("form").style.display = "none";
  document.getElementById("terminal").style.display = "block";

  let device = getDevice();
  let ip = await getIP();

  await typeLine("Connecting to university servers...", 800);
  await typeLine("Verifying credentials...", 1200);

  await typeLine("<span class='red'>WARNING: Suspicious login detected</span>", 1500);
  await typeLine("Intercepting session...", 1200);
  await typeLine("<span class='red'>ACCESS GRANTED</span>", 1200);

  await typeLine("Device: <span class='red'>" + device + "</span>", 1500);
  await typeLine("IP Address: <span class='red'>" + ip + "</span>", 1500);
  await typeLine("User: <span class='red'>" + name + "</span>", 1500);

  await typeLine("<span class='red'>DATA EXTRACTION IN PROGRESS</span>", 1500);

  for (let i = 5; i > 0; i--) {
    await typeLine("Uploading data in " + i + "...", 1000);
  }

  await typeLine("<span class='red'>TRANSFER COMPLETE</span>", 1200);

  await typeLine("<br><span class='red'>⚠ THIS WAS A SIMULATION ⚠</span>", 2000);
  await typeLine("You trusted a QR code without verifying it.", 1500);
  await typeLine("This is how phishing attacks happen.", 1500);
}
</script>

</body>
</html>
